<!DOCTYPE html><html><head><title>BHARAT v1.0.6</title><style>body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh} .box{background:#1e293b;padding:30px;border-radius:15px;width:360px;text-align:center;box-shadow:0 0 20px #38bdf8} input{width:90%;padding:12px;margin:8px;border-radius:8px;border:none} button{width:95%;padding:12px;background:#38bdf8;border:none;border-radius:8px;font-weight:bold;cursor:pointer} .res{margin-top:15px;background:#0f172a;padding:12px;border-radius:8px}</style></head><body><div class="box"><h2>🇮🇳 BHARAT FinGPT v1.0.6</h2><p>Inventor: MOHAMMAD SUBHAN PASHA</p><h3>PAN Verify SECURE</h3><input id="pan" value="ABCDE1234F"><input id="name" value="Demo Client"><button onclick="check()">VERIFY SECURE</button><div id="res" class="res">Ready...</div></div><script>async function check(){let pan=document.getElementById('pan').value;let name=document.getElementById('name').value;document.getElementById('res').innerText='Checking...';let r=await fetch('http://127.0.0.1:8000/api/v1/compliance/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pan_number:pan,name:name})});let d=await r.json();document.getElementById('res').innerHTML='<b>Masked:</b> '+d.pan_masked+'<br><b>Valid:</b> '+d.valid+'<br>'+d.message;}</script></body></html>
